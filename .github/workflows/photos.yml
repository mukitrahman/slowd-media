name: Prepare new photos

on:
  push:
    paths:
      - "products/*/inbox/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slowd-photos
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: pip install pillow pillow-heif
      - name: Crop and resize photos
        run: python3 scripts/prepare_photos.py
      - name: Save prepared photos
        run: |
          git add -A products
          if ! git diff --cached --quiet; then
            git config user.name "slowd-bot"
            git config user.email "slowd-bot@users.noreply.github.com"
            git commit -m "Prepare new photos"
            git pull --rebase
            git push
          fi
